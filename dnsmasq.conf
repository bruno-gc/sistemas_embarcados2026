# dnsmasq.conf - DHCP e DNS da rede TP9-GRUPO01
# Instalado em /etc/dnsmasq.conf pelo post-build.sh e iniciado pelo S40wifi-ap.

# atende somente a rede Wi-Fi, no IP da Raspberry
interface=wlan0
bind-interfaces
listen-address=192.168.50.1

# sem Internet: nao repassa consultas DNS para servidores externos
no-resolv

# faixa de enderecos entregue aos clientes (notebook/celular), lease de 12 h
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h

# opcao 3 = gateway e opcao 6 = DNS: ambos apontam para a Raspberry
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1

# arquivo de leases em /var/run (sistema de arquivos em memoria)
dhcp-leasefile=/var/run/dnsmasq.leases
