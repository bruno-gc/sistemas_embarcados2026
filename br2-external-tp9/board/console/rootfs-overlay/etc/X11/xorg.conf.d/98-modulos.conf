# O Buildroot linka tudo com RELRO completo (-z now). Assim os drivers do X
# (modesetting, fbdev) falham com "undefined symbol" se os submodulos que eles
# usam ainda nao estiverem carregados. Carregamos esses modulos antes.
Section "Module"
	Load "fb"
	Load "shadow"
	Load "fbdevhw"
	Load "glamoregl"
EndSection
