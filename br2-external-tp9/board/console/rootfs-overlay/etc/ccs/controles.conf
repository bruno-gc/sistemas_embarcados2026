# Controles de cada jogo no teclado, mostrados no menu (tecla C / Triangulo)
# e na tela "Abrindo...". Formato: id|teclas|acao
# Varias teclas para a mesma acao: separar com "/" (ex.: W/A/S/D).
# Padrao adotado (o mesmo dos jogos de PC): WASD ou setas para andar,
# Espaco para pular, mouse para mirar nos FPS, Enter e Esc nos menus.

cs16|W/A/S/D|Andar
cs16|Mouse|Mirar
cs16|Clique|Atirar
cs16|Espaço|Pular
cs16|Ctrl|Agachar
cs16|R|Recarregar
cs16|E|Usar
cs16|B|Comprar armas
cs16|Esc|Menu
cs16|Home (1 s)|Voltar ao menu do CCS

sm64|W/A/S/D|Andar
sm64|Espaço|Pular (A)
sm64|E|Soco / pegar (B)
sm64|Shift|Agachar (Z)
sm64|Setas|Câmera
sm64|Q|Modo da câmera (R)
sm64|Enter|Pausa (Start)
sm64|Home (1 s)|Voltar ao menu do CCS

zelda|Controle|Recomendado: o controle de PS5 já vem configurado
