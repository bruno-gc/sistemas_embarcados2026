<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCS - Console Contra Sony</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='painel.css') }}">
</head>
<body>
  <header>
    <div class="marca"><span class="sigla">CCS</span> Console Contra Sony</div>
    <div class="sistema" id="sistema">conectando...</div>
  </header>

  <main>
    <section class="tv" id="tv">
      <div>
        <div class="rotulo">Na TV agora</div>
        <div class="estado" id="estado">--</div>
      </div>
      <button id="parar" class="perigo" hidden>Encerrar jogo</button>
    </section>

    <div class="aviso" id="aviso" hidden></div>

    <section class="grade" id="grade"></section>

    <section class="sensor" id="sensor" hidden>
      <div class="rotulo">Sensor HC-SR04 (TP9)</div>
      <div class="estado" id="distancia">--</div>
    </section>
  </main>

  <footer>Escolha um jogo para abrir na TV. O menu da Raspberry tambem aceita teclado e controle USB.</footer>
  <script src="{{ url_for('static', filename='painel.js') }}"></script>
</body>
</html>
