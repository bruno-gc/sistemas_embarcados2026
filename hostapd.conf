# hostapd.conf - Access Point Wi-Fi da Raspberry Pi 4 (TP9, Grupo 01)
# Instalado em /etc/hostapd.conf pelo post-build.sh e iniciado pelo S40wifi-ap.

# interface Wi-Fi onboard e driver padrao do Linux para Wi-Fi (nl80211)
interface=wlan0
driver=nl80211

# nome da rede, no padrao TP9-GRUPOXX
ssid=TP9-GRUPO01

# regiao regulatoria (Brasil): define os canais e potencias permitidos
country_code=BR

# 2,4 GHz (802.11g), canal 6
hw_mode=g
channel=6

# seguranca WPA2-PSK com criptografia AES (CCMP)
wpa=2
wpa_passphrase=embarcados2026
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
